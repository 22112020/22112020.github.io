<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TGQ — Togel Prediction</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="img/tgq-logo.svg">
  <style>
    :root {
      --bg-darkest: #0a0008;
      --bg-dark: #1a0010;
      --maroon-deep: #4a0014;
      --maroon-primary: #800020;
      --maroon-bright: #a50030;
      --pink-accent: #ff6b9d;
      --pink-glow: #ff4d8b;
      --text-light: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.6);
      --success-color: #4caf50;
      --error-color: #f44336;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-darkest) 0%, var(--bg-dark) 30%, var(--maroon-deep) 70%, var(--maroon-primary) 100%);
      background-attachment: fixed;
      color: var(--text-light);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 77, 139, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(165, 0, 48, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(128, 0, 32, 0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .sidebar {
      background: linear-gradient(180deg, rgba(74, 0, 20, 0.8) 0%, rgba(26, 0, 16, 0.9) 100%);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 107, 157, 0.2);
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.5);
    }

    .sidebar-header {
      border-bottom: 1px solid rgba(255, 107, 157, 0.2);
    }

    .sidebar-logo {
      filter: brightness(0) invert(1) drop-shadow(0 0 8px rgba(255, 107, 157, 0.6));
    }

    .brand-name {
      color: var(--text-light);
    }

    .brand-sub {
      color: var(--text-muted);
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      margin: 0.25rem 0;
      border-radius: 8px;
      transition: all 0.3s ease;
      color: var(--text-soft);
    }

    .nav-item:hover {
      background: rgba(255, 107, 157, 0.1);
      color: var(--text-light);
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(128, 0, 32, 0.6), rgba(255, 107, 157, 0.3));
      color: var(--text-light);
      border-right: 3px solid var(--pink-accent);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      margin-right: 0.75rem;
      filter: brightness(0) invert(1) drop-shadow(0 0 4px rgba(255, 107, 157, 0.5));
    }

    .sidebar-footer {
      border-top: 1px solid rgba(255, 107, 157, 0.2);
      padding: 1rem 1.5rem;
    }

    .server-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error-color);
      animation: pulse 2s infinite;
    }

    .status-dot.online {
      background: var(--success-color);
      animation: pulse-success 2s infinite;
    }

    .server-uptime {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .utilization {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin: 1rem 0;
    }

    .ram, .uptime, .time {
      color: var(--text-light);
      font-family: 'Courier New', monospace;
    }

    .main-content {
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    .loading-overlay {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
    }

    .page {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 107, 157, 0.1);
    }

    .bottom-nav {
      background: linear-gradient(180deg, rgba(74, 0, 20, 0.8) 0%, rgba(26, 0, 16, 0.9) 100%);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 107, 157, 0.2);
    }

    .bottom-nav-item {
      color: var(--text-soft);
    }

    .bottom-nav-item.active {
      color: var(--pink-accent);
    }

    .bottom-nav-item .nav-icon {
      display: block;
      margin: 0 auto 0.25rem;
    }

    /* Animations */
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.4);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(244, 67, 54, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(244, 67, 54, 0);
      }
    }

    @keyframes pulse-success {
      0% {
        box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(76, 175, 80, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(76, 175, 80, 0);
      }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="img/tgq-logo.svg" alt="TGQ" class="sidebar-logo">
      <div>
        <div class="brand-name">TGQ</div>
        <span class="brand-sub">Prediction Engine</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="server-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Checking...</span>
      </div>
      <div class="server-uptime" id="uptimeLabel"></div>
      <div class="utilization">
        <div class="ram">RAM: 2.2Gi / 5.1Gi</div>
        <div class="uptime">Uptime: 3 days, 4:26</div>
        <div class="time">Time: 01:10:38</div>
      </div>
    </div>
  </aside>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <main class="main-content" id="mainContent">
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
    <div class="page active" id="pageContainer"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/markets.js"></script>
  <script src="js/pages/analysis.js"></script>
  <script src="js/pages/results.js"></script>
  <script src="js/pages/input.js"></script>
  <script src="js/pages/about.js"></script>
  <script src="js/app.js"></script>
  <script>
    function updateTime() {
      const timeElement = document.querySelector('.time');
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      timeElement.textContent = `Time: ${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
